services:
  - type: web
    name: dsa-tracker-app
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

databases:
  - name: dsa-tracker-db
    plan: free
    databaseName: daily_tracker
    user: postgres
