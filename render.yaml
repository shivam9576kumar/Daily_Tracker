services:
  - type: web
    name: dsa-tracker-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
